# ==============================================================================
# Kubernetes Secret Template for E-KYC Platform
#
# IMPORTANT SECURITY NOTES:
# 1. NEVER commit real production secrets, passwords, or tokens to version control.
# 2. Kubernetes Secrets are only base64-encoded by default (NOT encrypted).
#    Enable Kubernetes Secrets Encryption at Rest in your cluster's API server.
#    Restrict access using Kubernetes RBAC Role/RoleBinding.
#
# HOW TO CREATE THIS SECRET DIRECTLY VIA KUBECTL (RECOMMENDED):
#   kubectl create secret generic ekyc-secrets \
#     --namespace=ekyc-platform \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD='YOUR_STRONG_PASSWORD' \
#     --from-literal=JWT_SECRET_KEY='YOUR_64_CHAR_RANDOM_SECRET_KEY' \
#     --from-literal=DATABASE_URL='postgresql://postgres:YOUR_STRONG_PASSWORD@db:5432/ekyc_db'
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ekyc-secrets
  namespace: ekyc-platform
  labels:
    app.kubernetes.io/name: ekyc-secrets
    app.kubernetes.io/part-of: ekyc-platform
type: Opaque
stringData:
  # PostgreSQL Credentials (replace before deploying)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "replace_with_a_secure_database_password_min_16_chars"

  # JWT Signing Secret (Generate using: python -c "import secrets; print(secrets.token_urlsafe(48))")
  JWT_SECRET_KEY: "replace_with_a_cryptographically_secure_random_key_at_least_32_bytes"

  # SQLAlchemy Database Connection URL
  # Format: postgresql://<user>:<password>@<internal-service-name>:<port>/<dbname>
  DATABASE_URL: "postgresql://postgres:replace_with_a_secure_database_password_min_16_chars@db:5432/ekyc_db"

