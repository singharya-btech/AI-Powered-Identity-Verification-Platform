apiVersion: batch/v1
kind: Job
metadata:
  name: ekyc-db-migrate
  namespace: ekyc-platform
  labels:
    app.kubernetes.io/name: ekyc-db-migrate
    app.kubernetes.io/part-of: ekyc-platform
    app.kubernetes.io/component: migration
spec:
  # Retain completed job for 10 minutes before automatic garbage collection
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ekyc-db-migrate
        app.kubernetes.io/part-of: ekyc-platform
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: ekyc-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Checking PostgreSQL connectivity at db:5432..."
              until python -c "import socket; s = socket.socket(); s.settimeout(2); s.connect(('db', 5432)); s.close()"; do
                echo "PostgreSQL is not accepting connections yet - sleeping 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready and accepting TCP connections!"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: alembic-migrator
          image: ekyc-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ekyc-secrets
                  key: DATABASE_URL
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: ekyc-config
                  key: APP_ENV
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

