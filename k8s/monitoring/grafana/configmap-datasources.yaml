apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ekyc-platform
  labels:
    app: grafana
    app.kubernetes.io/component: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: http://prometheus:9090
        isDefault: true
        version: 1
        editable: false
        jsonData:
          timeInterval: 15s
          httpMethod: POST

