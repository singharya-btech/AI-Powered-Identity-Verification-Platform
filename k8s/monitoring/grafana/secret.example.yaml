# ==============================================================================
# Grafana Admin Credentials Secret (Template)
#
# IMPORTANT:
# 1. Do NOT commit production credentials to version control.
# 2. In production, create this secret directly via kubectl:
#    kubectl create secret generic grafana-admin-secret \
#      --namespace=ekyc-platform \
#      --from-literal=admin-user=admin \
#      --from-literal=admin-password='YOUR_STRONG_PASSWORD'
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: ekyc-platform
  labels:
    app: grafana
    app.kubernetes.io/component: monitoring
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "replace_with_a_secure_grafana_password_min_16_chars"

