apiVersion: v1
kind: ConfigMap
metadata:
  name: ekyc-config
  namespace: ekyc-platform
  labels:
    app.kubernetes.io/name: ekyc-config
    app.kubernetes.io/part-of: ekyc-platform
data:
  # Application Runtime Settings
  APP_NAME: "E-KYC Verification Platform"
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  API_V1_STR: "/api/v1"

  # PostgreSQL Non-Sensitive Settings
  POSTGRES_DB: "ekyc_db"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"

  # Database Connection Pool Tuning
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_PRE_PING: "true"
  DB_POOL_RECYCLE: "1800"

  # CORS Allowed Origins
  CORS_ORIGINS: "http://localhost,http://localhost:80,http://ekyc.local"

  # AI & Model Storage Paths
  DEEPFACE_HOME: "/app/data"
  EASYOCR_MODULE_PATH: "/home/appuser/.EasyOCR"

  # JWT Token Configuration
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

