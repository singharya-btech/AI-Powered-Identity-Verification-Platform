apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ekyc-db-data
  namespace: ekyc-platform
  labels:
    app.kubernetes.io/name: ekyc-db-data
    app.kubernetes.io/part-of: ekyc-platform
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
