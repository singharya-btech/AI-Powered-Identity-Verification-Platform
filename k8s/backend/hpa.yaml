# ==============================================================================
# Horizontal Pod Autoscaler (HPA) for E-KYC Backend
#
# PREREQUISITES & ARCHITECTURAL REQUIREMENTS:
# 1. Kubernetes Metrics Server must be deployed in the cluster:
#      kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# 2. STORAGE CLASS REQUIREMENT:
#    The ekyc-ai-models-cache PVC must use a ReadWriteMany (RWX) storage class
#    (e.g., AWS EFS, Azure Files, NFS, or CephFS) OR model weights must be pre-baked
#    into the container image before scaling beyond 1 replica across worker nodes.
# 3. DO NOT scale the PostgreSQL StatefulSet with HPA (Stateful relational databases
#    require dedicated replication clustering, e.g., Patroni / CloudNativePG).
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ekyc-backend-hpa
  namespace: ekyc-platform
  labels:
    app.kubernetes.io/name: ekyc-backend-hpa
    app.kubernetes.io/part-of: ekyc-platform
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ekyc-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # 5-minute cooldown to prevent flapping during bursty OCR/FaceNet inference
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30

